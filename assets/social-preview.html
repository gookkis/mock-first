<!doctype html><meta charset="utf-8"><title>social preview</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
  body{
    background:#0f172a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#e2e8f0;
  }
  .glow{position:absolute;top:-180px;left:50%;transform:translateX(-50%);
        width:900px;height:420px;border-radius:50%;
        background:radial-gradient(closest-side,rgba(99,102,241,.20),transparent);}
  .wrap{position:relative;text-align:center;padding-bottom:8px}
  .logo{width:88px;height:88px;margin-bottom:22px}
  h1{margin:0;font-size:70px;letter-spacing:-.025em;font-weight:700;color:#fff}
  .tag{margin:14px 0 0;font-size:25px;color:#94a3b8;font-weight:400}
  .flow{margin-top:44px;display:flex;align-items:center;justify-content:center;gap:14px;
        font:600 21px ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .cmd{color:#a5b4fc;background:rgba(99,102,241,.12);border:1px solid rgba(129,140,248,.30);
       border-radius:9px;padding:9px 17px}
  .arw{color:#475569;font-size:19px}
  .back{margin-top:18px;font:400 19px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#64748b}
  .back code{font:600 18px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#a5b4fc}
  .back b{color:#a5b4fc;font-weight:600}
  .foot{margin-top:42px;font-size:17px;color:#475569}
  .foot b{color:#64748b;font-weight:500}
</style>
<div class="glow"></div>
<div class="wrap">
  <svg class="logo" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <path fill="none" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round"
          d="M 20 12 H 76 a 8 8 0 0 1 8 8 V 58 L 58 84 H 20 a 8 8 0 0 1 -8 -8 V 20 a 8 8 0 0 1 8 -8 Z"/>
    <rect x="24" y="24" width="48" height="8" rx="4" fill="#818cf8"/>
    <path stroke="#64748b" stroke-width="5" stroke-linecap="round" d="M 26 46 H 62"/>
    <path stroke="#64748b" stroke-width="5" stroke-linecap="round" d="M 26 60 H 46"/>
    <path fill="#818cf8" d="M 84 58 L 58 84 V 62 a 4 4 0 0 1 4 -4 Z"/>
    <path fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linejoin="round" d="M 84 58 L 58 84"/>
  </svg>

  <h1>Mock-First</h1>
  <p class="tag">Agree on the screen before you write the code.</p>

  <div class="flow">
    <span class="cmd">/prd</span><span class="arw">&#8594;</span>
    <span class="cmd">/mockup</span><span class="arw">&#8594;</span>
    <span class="cmd">/break-task</span><span class="arw">&#8594;</span>
    <span class="cmd">/coding</span>
  </div>
  <div class="back">&#8634; every change goes back through <code>/revise</code>, which reports impact first</div>

  <p class="foot"><b>A workflow for Claude Code</b> &nbsp;·&nbsp; github.com/gookkis/mock-first</p>
</div>
