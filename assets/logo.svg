<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Mock-First logo: a wireframe screen with its corner folded back to reveal code">
  <style>
    .frame { fill: none; stroke: #475569; stroke-width: 5; stroke-linejoin: round; }
    .bar   { fill: #6366f1; }
    .line  { stroke: #94a3b8; stroke-width: 5; stroke-linecap: round; }
    .fold  { fill: #6366f1; }
    .foldedge { fill: none; stroke: #4338ca; stroke-width: 3; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #8b949e; }
      .bar   { fill: #818cf8; }
      .line  { stroke: #6e7681; }
      .fold  { fill: #818cf8; }
      .foldedge { stroke: #a5b4fc; }
    }
  </style>

  <!-- screen frame with the bottom-right corner cut away -->
  <path class="frame" d="M 20 12 H 76 a 8 8 0 0 1 8 8 V 58 L 58 84 H 20 a 8 8 0 0 1 -8 -8 V 20 a 8 8 0 0 1 8 -8 Z"/>

  <!-- app bar + content lines: the wireframe -->
  <rect class="bar" x="24" y="24" width="48" height="8" rx="4"/>
  <path class="line" d="M 26 46 H 62"/>
  <path class="line" d="M 26 60 H 46"/>

  <!-- the folded corner, revealing the accent underneath -->
  <path class="fold" d="M 84 58 L 58 84 V 62 a 4 4 0 0 1 4 -4 Z"/>
  <path class="foldedge" d="M 84 58 L 58 84"/>
</svg>
